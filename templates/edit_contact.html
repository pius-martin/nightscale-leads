{% extends "base.html" %}
{% block title %}Edit contact{% endblock %}
{% block container_class %} narrow{% endblock %}
{% block content %}

<div class="page-header">
    <h1>Edit contact</h1>
</div>

<div class="card">
    <form method="post" class="form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label>Company
            <input type="text" name="firma" value="{{ contact.firma }}"
                   class="{{ 'invalid' if form_errors and 'firma' in form_errors }}">
            {% if form_errors and form_errors.firma %}<span class="field-error">{{ form_errors.firma }}</span>{% endif %}
        </label>
        <div class="row" style="gap:14px">
            <label style="flex:1; min-width:180px">First name
                <input type="text" name="first_name" value="{{ contact.first_name }}">
            </label>
            <label style="flex:1; min-width:180px">Last name
                <input type="text" name="last_name" value="{{ contact.last_name }}">
            </label>
        </div>
        <label>Email
            <input type="email" name="email" value="{{ contact.email }}" required
                   class="{{ 'invalid' if form_errors and 'email' in form_errors }}">
            {% if form_errors and form_errors.email %}<span class="field-error">{{ form_errors.email }}</span>{% endif %}
        </label>
        <label>Type
            <select name="art" required>
                {% for a in arten %}<option value="{{ a }}" {% if a == contact.art %}selected{% endif %}>{{ a }}</option>{% endfor %}
                {% if contact.art and contact.art not in arten %}
                    <option value="{{ contact.art }}" selected>{{ contact.art }} (legacy)</option>
                {% endif %}
            </select>
        </label>
        <label>POS system
            <input type="text" name="pos_system" value="{{ contact.pos_system }}" placeholder="e.g. Lightspeed, Vectron, Gastrofix">
            <span class="hint">Optional — point-of-sale system, used for segmenting.</span>
        </label>
        <label>Notes
            <textarea name="notes" rows="3">{{ contact.notes }}</textarea>
        </label>
        <div class="row">
            <button class="btn btn-primary" type="submit">Save</button>
            <a class="btn btn-ghost" href="{{ url_for('contacts') }}">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
