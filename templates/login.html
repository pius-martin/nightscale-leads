<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Nightscale</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="login-screen">
        <div class="card login-card">
            <div class="brand" style="justify-content:center">
                <img src="{{ url_for('static', filename='002_W.png') }}" alt="Nightscale" class="brand-logo brand-logo-lg">
            </div>
            <form method="post" class="form" data-loading="Signing in…"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label>Password
                    <input type="password" name="password" required autofocus>
                </label>
                {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center">Sign in</button>
            </form>
        </div>
    </main>
</body>
</html>
